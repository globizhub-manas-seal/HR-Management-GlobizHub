name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'hrms-backend-v1/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'hrms-backend-v1/**'
      

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./hrms-backend-v1

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './hrms-backend-v1/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Run linting
      run: npm run lint
      
    - name: Run tests
      run: npm run test
      
    - name: Build project
      run: npm run build
