version: '3.8'

services:
  backend:
    build:
      context: ./hrms-backend-v1
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://hrms_user:hrms_pass@db:5432/hrms_db?schema=public
      - JWT_SECRET=your_super_secret_jwt_key
      - PORT=5000
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=hrms_user
      - POSTGRES_PASSWORD=hrms_pass
      - POSTGRES_DB=hrms_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
